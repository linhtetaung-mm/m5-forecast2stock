# All split ranges are inclusive target-day bounds.
project:
  name: m5-forecast2stock
  protocol_version: 1
  random_seed: 42
  sales_are_demand_proxy: true

data:
  raw_dir: data/raw
  processed_dir: data/processed
  stores:
    - CA_1
  expected_series_per_store: 3049
  panel_start: "2013-01-01"
  panel_end: "2016-04-24"
  files:
    sales: sales_train_validation.csv
    calendar: calendar.csv
    prices: sell_prices.csv
  expected_sha256:
    sales: f368e66ed1dbecb48b2cc8fc589bf68b3deddbbb36bf5c88b4d6d0a09b9b6724
    calendar: d12b5914ef03e66649adf5dd9e996e6602251c22b7a6af8f1f7e3aa12f8860f5
    prices: 9da3ad1f8b8ccacdbdc70612191dd375ec24a4ac6625c24b75b3bc60b0bed2ef

splits:
  training: {start: "2014-01-01", end: "2015-09-10"}
  development: {start: "2015-09-11", end: "2015-10-08"}
  calibration: {start: "2015-10-09", end: "2016-01-07"}
  policy_validation: {start: "2016-01-08", end: "2016-03-03"}
  warmup: {start: "2016-03-04", end: "2016-03-31"}
  final_test: {start: "2016-04-01", end: "2016-04-24"}

regimes:
  zero_share_threshold: 0.60
  cv2_threshold: 0.49
  min_positive_days: 2
  sensitivity_zero_thresholds: [0.50, 0.60, 0.70]
  sensitivity_cv2_thresholds: [0.36, 0.49, 0.64]
  output_dir: data/processed/regimes

# Forecast settings and planned inventory scenarios.
forecast:
  output_dir: artifacts/forecasting
  # Fit each SKU on a staggered set of origins. Score every eligible origin.
  training_origin_stride: 12
  daily_horizons: [1, 2, 3, 4, 5, 6, 7, 8]
  cumulative_horizons: [2, 8]
  quantiles: [0.50, 0.75, 0.90, 0.95]
  leakage_contract:
    origin: last_completed_sales_day
    use_only_complete_target_windows: true
    publication_proxy: completed_m5_price_week
    target_calendar: published_schedule
  feature_settings:
    lags: [0, 1, 7, 14, 28]
    rolling_windows: [7, 14, 28]
    zero_share_window: 28
    # The default price age is reported as a feature. Availability is checked separately.
    include_as_of_price: true
  baselines:
    seasonal_period_days: 7
    average_window_days: 28
    croston_smoothing: 0.10
  lightgbm:
    objective: quantile
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 100
    num_boost_round: 96
    max_bin: 63
    num_threads: 4
    deterministic: true
    refit_on_training_and_development: true
  metrics:
    rmsse_scale: training_first_differences_after_first_positive_sale
    spl_scale: training_mean_absolute_first_difference
    report_zero_scale_counts: true

inventory:
  review_days: 1
  lead_times: [1, 7]
  protection_periods: [2, 8]
  lost_sales: true
  fill_floor: 0.95
  service_comparability_tolerance: 0.0025
  include_common_state_cutover: true
  ending_pipeline: disclose
  terminal_adjustment: none
  critical_fractile:
    overage: protection_period_days_times_daily_holding
    tail_policy: clip_and_report
  costs:
    reference_price_lookback_weeks: 13
    reference_price_cutoff: "2016-01-07"
    days_per_year: 365
    annual_carry_rates: [0.12, 0.20, 0.35]
    margin_fractions: [0.15, 0.25, 0.40]
    stockout_multipliers: [0.5, 1.0, 2.0]
    positive_item_order_fees: [0.0, 0.05]
    base:
      annual_carry_rate: 0.20
      margin_fraction: 0.25
      stockout_multiplier: 1.0
      positive_item_order_fee: 0.0
    relative_daily_holding_to_shortage: [0.001, 0.003, 0.01, 0.03, 0.10, 0.25]

artifacts:
  model_dir: artifacts/models
  forecast_dir: artifacts/forecasts
  report_dir: artifacts/reports
  recommendation_dir: artifacts/orders
